spring.application.name=laboratorio-prestamos

# Configuración por defecto para PostgreSQL local.
# Para conectar a la BD real del usuario use:
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/laboratorio_prestamos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0121}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
